name: Deploy MCP server to ECS

# Manual only -- builds server/, pushes to ECR, then applies the Terraform
# in infra/terraform (same state/pool as cognito-infra.yml -- this is one
# module, ECS is just more resources in it) with the new image tag, which
# rolls the ECS service to the new task definition revision.
#
# Two-phase apply, deliberately: the image has to be pushed to ECR before
# the full apply can reference it in the task definition, but the ECR
# *repository* has to exist before you can push to it. First apply targets
# just the repo (idempotent -- a no-op if it's already there), then the
# image gets built/pushed, then the full apply creates/updates everything
# else. (Earlier version of this workflow had a separate imperative
# `aws ecr create-repository` step instead of the targeted apply -- that
# raced with Terraform's own aws_ecr_repository resource and failed with
# RepositoryAlreadyExistsException on every run after the first.)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        type: choice
        options: [plan, apply, destroy]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=cognito/workshop/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform plan
        if: inputs.action == 'plan'
        run: terraform plan -var "aws_region=${{ vars.AWS_REGION }}"

      - name: Ensure ECR repositories exist (targeted apply)
        if: inputs.action == 'apply'
        run: |
          terraform apply -auto-approve -var "aws_region=${{ vars.AWS_REGION }}" \
            -target=aws_ecr_repository.mcp_server \
            -target=aws_ecr_repository.launcher \
            -target=aws_ecr_repository.attendee_base

      - uses: aws-actions/amazon-ecr-login@v2
        if: inputs.action == 'apply'
        id: ecr-login

      - name: Build and push finance server image
        if: inputs.action == 'apply'
        working-directory: server
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/mcp-finance-server:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image_tag=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Build and push launcher image
        if: inputs.action == 'apply'
        working-directory: launcher
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/mcp-launcher:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "launcher_image_tag=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Build and push attendee base image
        if: inputs.action == 'apply'
        working-directory: launcher/attendee_base
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/mcp-attendee-base:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "attendee_base_image_tag=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Terraform apply
        if: inputs.action == 'apply'
        run: |
          terraform apply -auto-approve -var "aws_region=${{ vars.AWS_REGION }}" \
            -var "image_tag=${{ env.image_tag }}" \
            -var "launcher_image_tag=${{ env.launcher_image_tag }}" \
            -var "attendee_base_image_tag=${{ env.attendee_base_image_tag }}"

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve -var "aws_region=${{ vars.AWS_REGION }}"

      - name: Publish outputs to job summary
        if: inputs.action == 'apply'
        run: |
          {
            echo "## MCP server deployed"
            echo ""
            echo "Public URL (CloudFront, HTTPS): $(terraform output -raw mcp_server_public_url)"
            echo ""
            echo "MCP Builder Launcher URL: $(terraform output -raw launcher_public_url)"
            echo "(give attendees this as LAUNCHER_BASE_URL in kickstart/.env for step 7, submit.py)"
            echo ""
            echo "Optional custom domain -- add this CNAME at Porkbun if you want mcp.seetaram.dev:"
            echo '```'
            terraform output -raw porkbun_dns_record_for_custom_domain
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
